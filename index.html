<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библейский граф</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <div id="loading">
        <div class="spinner"></div>
        <p>ЗАГРУЗКА</p>
        <div id="error"></div>
    </div>

    <div id="stats"><span id="nodeCount">0</span> стихов</div>
    <div id="tooltip"></div>
    <div id="clearBtn" class="hidden">✕ Сброс</div>

    <div id="searchPanel">
        <input type="text" id="searchInput" placeholder="Поиск стиха (напр. Ин 3:16)" autocomplete="off">
        <div id="searchResults"></div>
    </div>

    <div id="verseInfo">
        <button class="close-btn" id="closeVerseInfo">✕</button>
        <div class="verse-ref" id="verseRef"></div>
        <div class="verse-text" id="verseText"></div>
        <div class="related-title">Связанные стихи</div>
        <div id="relatedVerses"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="data-loader.js"></script>
<script src="graph.js"></script>
<script src="search.js"></script>
<script src="app.js"></script>
</body>
</html>
