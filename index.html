<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библейский граф · Ин 3:16 в центре</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0c10;
            color: #ececec;
            overflow: hidden;
            height: 100vh;
        }
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #141a22;
            padding: 30px 50px;
            border-radius: 16px;
            border: 1px solid #2a303c;
            text-align: center;
            z-index: 100;
        }
        #loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #2a303c;
            border-top: 4px solid #ffcc80;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #90a4ae; font-size: 16px; }
        #info {
            position: absolute;
            bottom: 24px;
            left: 24px;
            background: rgba(12,16,24,0.85);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid #2a303c;
            font-size: 13px;
            color: #b0bec5;
            pointer-events: none;
            z-index: 10;
        }
        #info strong { color: #ffcc80; }
        #stats {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(12,16,24,0.8);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #2a303c;
            font-size: 12px;
            color: #78909c;
            pointer-events: none;
            z-index: 10;
        }
        #stats span { color: #cfd8dc; font-weight: 600; }
        #tooltip {
            position: absolute;
            background: #1e2430;
            color: #f0f0f0;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid #3f4a5c;
            pointer-events: none;
            font-size: 13px;
            opacity: 0;
            z-index: 20;
            transition: opacity 0.15s;
        }
        #tooltip.visible { opacity: 1; }
        .hidden { display: none !important; }
        #error {
            color: #ef5350;
            font-size: 14px;
            margin-top: 12px;
        }
        #hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12,16,24,0.85);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid #2a303c;
            font-size: 12px;
            color: #78909c;
            pointer-events: none;
            z-index: 10;
            opacity: 0.8;
            transition: opacity 1s;
        }
        #hint.fade { opacity: 0; }
        #layerInfo {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12,16,24,0.85);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #2a303c;
            font-size: 12px;
            color: #78909c;
            pointer-events: none;
            z-index: 10;
        }
        #layerInfo span { color: #ffcc80; font-weight: 600; }
        #modeInfo {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12,16,24,0.9);
            padding: 6px 20px;
            border-radius: 20px;
            border: 1px solid #ffcc80;
            font-size: 12px;
            color: #ffcc80;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #modeInfo.show { opacity: 1; }
        #clearBtn {
            position: absolute;
            bottom: 80px;
            right: 24px;
            background: rgba(12,16,24,0.85);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #2a303c;
            color: #78909c;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }
        #clearBtn:hover {
            background: rgba(255,204,128,0.15);
            border-color: #ffcc80;
            color: #ffcc80;
        }
        #clearBtn.hidden { display: none; }
    </style>
</head>
<body>

<div id="container">
    <div id="loading">
        <div class="spinner"></div>
        <p>ЗАГРУЗКА ГРАФА</p>
        <div id="error"></div>
    </div>
    <div id="info"><strong>Библейский граф</strong> · Ин 3:16 в центре</div>
    <div id="stats"><span id="nodeCount">0</span> узлов · <span id="linkCount">0</span> связей</div>
    <div id="tooltip"></div>
    <div id="hint">Отдаляйся колесиком мыши · Клик — соседи, ещё клик — все связи</div>
    <div id="layerInfo">Слой <span id="currentLayer">0 (центр)</span></div>
    <div id="modeInfo"></div>
    <div id="clearBtn" class="hidden">✕ Сбросить</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const loading = document.getElementById('loading');
let selectedNodeId = null;
let clickCount = 0;
let allLinks = [];
let allNodes = [];

fetch('bible_graph_full.json')
    .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
    })
    .then(data => {
        loading.classList.add('hidden');
        const positioned = buildLayeredGraph(data);
        allLinks = positioned.links;
        allNodes = positioned.nodes;
        initGraph(positioned);
    })
    .catch(err => {
        loading.innerHTML = `
            <p style="color:#ef5350;">Ошибка загрузки</p>
            <p style="font-size:13px;color:#78909c;">${err.message}</p>
            <p style="font-size:13px;color:#78909c;margin-top:4px;">
                Файл <strong>bible_graph_full.json</strong> должен лежать рядом
            </p>
        `;
        console.error(err);
    });

// ============================================================
// РАЗМЕЩЕНИЕ
// ============================================================
function buildLayeredGraph(data) {
    const { nodes, links } = data;
    const CENTER = 'Ин 3:16';

    const graph = {};
    nodes.forEach(n => graph[n.id] = { node: n, neighbors: new Set() });
    links.forEach(l => {
        if (graph[l.source] && graph[l.target]) {
            graph[l.source].neighbors.add(l.target);
            graph[l.target].neighbors.add(l.source);
        }
    });

    const layers = {};
    const visited = new Set();
    const queue = [];
    let maxLayer = 0;

    if (graph[CENTER]) {
        layers[CENTER] = 0;
        visited.add(CENTER);
        queue.push(CENTER);
    }

    let head = 0;
    while (head < queue.length) {
        const current = queue[head++];
        const curLayer = layers[current];
        for (const nb of graph[current].neighbors) {
            if (!visited.has(nb) && graph[nb]) {
                visited.add(nb);
                layers[nb] = curLayer + 1;
                if (curLayer + 1 > maxLayer) maxLayer = curLayer + 1;
                queue.push(nb);
            }
        }
    }

    nodes.forEach(n => {
        if (!visited.has(n.id)) layers[n.id] = -1;
    });

    const groups = {};
    nodes.forEach(n => {
        const layer = layers[n.id] ?? -1;
        if (!groups[layer]) groups[layer] = [];
        groups[layer].push(n);
    });

    const RADIUS_STEP = 500;

    const positioned = [];
    const centerNode = nodes.find(n => n.id === CENTER);
    if (centerNode) {
        positioned.push({ ...centerNode, x: 0, y: 0, layer: 0 });
    }

    const sortedLayers = Object.keys(groups)
        .map(Number)
        .filter(l => l !== 0)
        .sort((a, b) => a - b);

    for (const layerNum of sortedLayers) {
        const group = groups[layerNum];
        const radius = RADIUS_STEP * (layerNum + 1);
        const actualRadius = layerNum === -1 ? RADIUS_STEP * (maxLayer + 3) : radius;
        const count = group.length;
        const angleStep = (2 * Math.PI) / count;

        group.forEach((node, i) => {
            const angle = i * angleStep + layerNum * 0.2;
            const jitter = (Math.random() - 0.5) * 60;
            const x = Math.cos(angle) * (actualRadius + jitter);
            const y = Math.sin(angle) * (actualRadius + jitter);
            positioned.push({ ...node, x, y, layer: layerNum });
        });
    }

    for (let iter = 0; iter < 5; iter++) {
        for (let i = 0; i < positioned.length; i++) {
            for (let j = i+1; j < positioned.length; j++) {
                const a = positioned[i];
                const b = positioned[j];
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const minDist = 100;
                if (dist < minDist && dist > 0) {
                    const force = (minDist - dist) / 2;
                    const angle = Math.atan2(dy, dx);
                    a.x += Math.cos(angle) * force;
                    a.y += Math.sin(angle) * force;
                    b.x -= Math.cos(angle) * force;
                    b.y -= Math.sin(angle) * force;
                }
            }
        }
    }

    return { nodes: positioned, links };
}

// ============================================================
// ОТРИСОВКА
// ============================================================
function initGraph(data) {
    const { nodes, links } = data;

    document.getElementById('nodeCount').textContent = nodes.length;
    document.getElementById('linkCount').textContent = links.length;

    const container = document.getElementById('container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    const svg = d3.select('#container')
        .append('svg')
        .attr('width', width)
        .attr('height', height)
        .style('background', '#0a0c10');

    const g = svg.append('g');

    const nodeMap = {};
    nodes.forEach(n => nodeMap[n.id] = n);

    const linkData = links.map(l => ({
        source: nodeMap[l.source],
        target: nodeMap[l.target],
        id: l.source + '→' + l.target
    })).filter(l => l.source && l.target);

    // Строим граф для BFS
    const graph = {};
    nodes.forEach(n => graph[n.id] = { neighbors: new Set() });
    linkData.forEach(l => {
        graph[l.source.id].neighbors.add(l.target.id);
        graph[l.target.id].neighbors.add(l.source.id);
    });

    // Рисуем связи
    const linkGroup = g.append('g');
    const linkElements = linkGroup.selectAll('line')
        .data(linkData)
        .enter()
        .append('line')
        .attr('x1', d => d.source.x)
        .attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x)
        .attr('y2', d => d.target.y)
        .attr('stroke', '#2a303c')
        .attr('stroke-width', 1.2)
        .attr('stroke-opacity', 0.3)
        .attr('data-source', d => d.source.id)
        .attr('data-target', d => d.target.id);

    // Узлы и подписи
    const nodeGroup = g.append('g');
    const labelGroup = g.append('g');
    const modeInfo = document.getElementById('modeInfo');

    function showModeInfo(text, duration = 1500) {
        modeInfo.textContent = text;
        modeInfo.classList.add('show');
        clearTimeout(modeInfo._timeout);
        modeInfo._timeout = setTimeout(() => {
            modeInfo.classList.remove('show');
        }, duration);
    }

    // ============================================================
    // ФУНКЦИЯ ПОДСВЕТКИ
    // ============================================================
    function highlightNode(id, depth) {
        selectedNodeId = id;
        document.getElementById('clearBtn').classList.remove('hidden');

        // BFS для поиска всех узлов на глубине depth
        const visited = new Set();
        const queue = [{ id: id, dist: 0 }];
        const connectedIds = new Set();
        connectedIds.add(id);

        while (queue.length > 0) {
            const current = queue.shift();
            if (current.dist >= depth) continue;
            
            const neighbors = graph[current.id]?.neighbors || new Set();
            for (const nb of neighbors) {
                if (!visited.has(nb)) {
                    visited.add(nb);
                    connectedIds.add(nb);
                    queue.push({ id: nb, dist: current.dist + 1 });
                }
            }
        }

        // Подсвечиваем связи
        linkGroup.selectAll('line').each(function() {
            const line = d3.select(this);
            const source = line.attr('data-source');
            const target = line.attr('data-target');
            const isRelated = connectedIds.has(source) && connectedIds.has(target);
            
            if (isRelated) {
                line.transition().duration(300)
                    .attr('stroke', '#ffcc80')
                    .attr('stroke-opacity', 0.9)
                    .attr('stroke-width', 2.5);
            } else {
                line.transition().duration(300)
                    .attr('stroke', '#1a1f2a')
                    .attr('stroke-opacity', 0.1)
                    .attr('stroke-width', 0.8);
            }
        });

        // Подсвечиваем узлы
        nodeGroup.selectAll('circle').each(function() {
            const circle = d3.select(this);
            const nodeId = circle.attr('data-id');
            const isRelated = connectedIds.has(nodeId);
            const isCenter = circle.attr('data-center') === 'true';
            
            if (isRelated) {
                circle.transition().duration(300)
                    .attr('opacity', 1)
                    .attr('stroke', '#ffcc80')
                    .attr('stroke-width', isCenter ? 4 : 3);
                
                const currentR = parseFloat(circle.attr('r'));
                if (!circle.attr('data-original-r')) {
                    circle.attr('data-original-r', currentR);
                }
                circle.transition().duration(300)
                    .attr('r', currentR * 1.5);
            } else {
                circle.transition().duration(300)
                    .attr('opacity', 0.15)
                    .attr('stroke', '#1e2430')
                    .attr('stroke-width', isCenter ? 2 : 1);
            }
        });

        // Подсвечиваем подписи
        labelGroup.selectAll('text').each(function() {
            const textEl = d3.select(this);
            const x = parseFloat(textEl.attr('x'));
            const y = parseFloat(textEl.attr('y'));
            let found = null;
            for (const n of nodes) {
                if (Math.abs(n.x - x) < 5 && Math.abs(n.y - (y + 14)) < 25) {
                    found = n;
                    break;
                }
            }
            if (found) {
                const isRelated = connectedIds.has(found.id);
                textEl.transition().duration(300)
                    .attr('opacity', isRelated ? 1 : 0.1)
                    .attr('fill', isRelated ? '#ffcc80' : '#cfd8dc');
            }
        });

        // Показываем информацию о режиме
        if (depth === 1) {
            showModeInfo('🔗 Прямые связи (1 слой)');
        } else if (depth === Infinity) {
            showModeInfo('🌐 Все достижимые стихи');
        }
    }

    // ============================================================
    // СБРОС ПОДСВЕТКИ
    // ============================================================
    function clearHighlight() {
        selectedNodeId = null;
        clickCount = 0;
        document.getElementById('clearBtn').classList.add('hidden');

        linkGroup.selectAll('line').each(function() {
            const line = d3.select(this);
            line.transition().duration(300)
                .attr('stroke', '#2a303c')
                .attr('stroke-opacity', 0.3)
                .attr('stroke-width', 1.2);
        });

        nodeGroup.selectAll('circle').each(function() {
            const circle = d3.select(this);
            const isCenter = circle.attr('data-center') === 'true';
            const originalR = circle.attr('data-original-r') || (isCenter ? 24 : 5);
            
            circle.transition().duration(300)
                .attr('opacity', 1)
                .attr('stroke', '#1e2430')
                .attr('stroke-width', isCenter ? 3 : 1.5)
                .attr('r', originalR);
        });

        labelGroup.selectAll('text').each(function() {
            const textEl = d3.select(this);
            textEl.transition().duration(300)
                .attr('opacity', 1)
                .attr('fill', '#cfd8dc');
        });

        document.getElementById('tooltip').classList.remove('visible');
        showModeInfo('✕ Подсветка сброшена', 1000);
    }

    // ============================================================
    // ИНТЕРАКТИВНОСТЬ
    // ============================================================
    function createNode(node) {
        const isCenter = node.id === 'Ин 3:16';
        const radius = isCenter ? 24 : 5 + Math.min(node.links_count || 0, 10) * 1.2;
        const layer = node.layer ?? 0;

        let color;
        if (isCenter) color = '#ff6b6b';
        else if (layer === 1) color = '#ffcc80';
        else if (layer === 2) color = '#80cbc4';
        else if (layer >= 3) color = '#4db6ac';
        else if (layer === -1) color = '#78909c';
        else color = '#4db6ac';

        const circle = nodeGroup.append('circle')
            .attr('cx', node.x)
            .attr('cy', node.y)
            .attr('r', radius)
            .attr('fill', color)
            .attr('stroke', '#1e2430')
            .attr('stroke-width', isCenter ? 3 : 1.5)
            .attr('cursor', 'pointer')
            .attr('data-layer', layer)
            .attr('data-id', node.id)
            .attr('data-center', isCenter ? 'true' : 'false');

        const label = labelGroup.append('text')
            .attr('x', node.x)
            .attr('y', node.y - radius - 14)
            .attr('text-anchor', 'middle')
            .attr('font-size', isCenter ? 16 : 8 + Math.min(node.links_count || 0, 6) * 0.5)
            .attr('fill', '#cfd8dc')
            .attr('font-family', "'Segoe UI', sans-serif")
            .attr('font-weight', isCenter ? 'bold' : '500')
            .attr('pointer-events', 'none')
            .text(node.id);

        const text = label;
        const content = text.text();
        text.text('');
        text.append('tspan')
            .attr('stroke', '#0a0c10')
            .attr('stroke-width', 3)
            .attr('stroke-linejoin', 'round')
            .text(content);
        text.append('tspan')
            .attr('fill', '#cfd8dc')
            .text(content);

        // ============================================================
        // ЛОГИКА КЛИКА: 1 раз → соседи, 2 раза → все связи, 3 раза → сброс
        // ============================================================
        circle
            .on('mouseover', function(event) {
                if (selectedNodeId) return;
                const rect = container.getBoundingClientRect();
                const tooltip = document.getElementById('tooltip');
                tooltip.textContent = node.id;
                tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
                tooltip.style.top = (event.clientY - rect.top - 10) + 'px';
                tooltip.classList.add('visible');

                d3.select(this)
                    .transition().duration(150)
                    .attr('r', isCenter ? 30 : 7 + Math.min(node.links_count || 0, 10) * 1.4)
                    .attr('stroke', '#ffcc80')
                    .attr('stroke-width', 3);
            })
            .on('mousemove', function(event) {
                if (selectedNodeId) return;
                const rect = container.getBoundingClientRect();
                const tooltip = document.getElementById('tooltip');
                tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
                tooltip.style.top = (event.clientY - rect.top - 10) + 'px';
            })
            .on('mouseout', function() {
                if (selectedNodeId) return;
                document.getElementById('tooltip').classList.remove('visible');
                d3.select(this)
                    .transition().duration(150)
                    .attr('r', isCenter ? 24 : 5 + Math.min(node.links_count || 0, 10) * 1.2)
                    .attr('stroke', '#1e2430')
                    .attr('stroke-width', isCenter ? 3 : 1.5);
            })
            .on('click', function() {
                if (selectedNodeId === node.id) {
                    // Если уже выделен этот узел
                    clickCount++;
                    if (clickCount === 1) {
                        // Второй клик — все достижимые
                        highlightNode(node.id, Infinity);
                    } else if (clickCount >= 2) {
                        // Третий клик — сброс
                        clearHighlight();
                    }
                } else {
                    // Новый узел — начинаем с первого клика
                    selectedNodeId = node.id;
                    clickCount = 0;
                    highlightNode(node.id, 1);
                }
            });

        return { circle, label };
    }

    // Создаём все узлы
    nodes.forEach(n => createNode(n));

    // Кнопка сброса
    document.getElementById('clearBtn').addEventListener('click', clearHighlight);

    // ============================================================
    // МАСШТАБИРОВАНИЕ
    // ============================================================
    const zoom = d3.zoom()
        .scaleExtent([0.01, 2])
        .on('zoom', (event) => {
            g.attr('transform', event.transform);
            updateLayerInfo(event.transform.k);
        });

    svg.call(zoom);

    const initialScale = 0.15;
    const centerX = width / 2;
    const centerY = height / 2;
    svg.call(zoom.transform, d3.zoomIdentity.translate(centerX, centerY).scale(initialScale));

    function updateLayerInfo(scale) {
        let layerText = '0 (центр)';
        if (scale <= 0.12) layerText = '1';
        if (scale <= 0.09) layerText = '2';
        if (scale <= 0.06) layerText = '3+';
        if (scale <= 0.03) layerText = 'все (одиночные)';
        document.getElementById('currentLayer').textContent = layerText;
    }

    // Подсказка исчезает
    setTimeout(() => {
        document.getElementById('hint').classList.add('fade');
    }, 5000);

    window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        svg.attr('width', w).attr('height', h);
    });

    console.log('Граф готов, узлов:', nodes.length);
}
</script>
</body>
</html>
